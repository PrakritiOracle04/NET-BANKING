server:
  port: 8088

spring:
  application:
    name: banking-workflow-service
  datasource:
    url: ${WORKFLOW_DB_URL}
    username: ${WORKFLOW_DB_USERNAME}
    password: ${WORKFLOW_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS}
        retries: ${KAFKA_PRODUCER_RETRIES}

security:
  jwt:
    secret: ${JWT_SECRET}

services:
  internal-api-key: ${INTERNAL_API_KEY}
  account-service-url: ${ACCOUNT_SERVICE_URL}
  beneficiary-service-url: ${BENEFICIARY_SERVICE_URL}
  transaction-service-url: ${TRANSACTION_SERVICE_URL}
  auth-service-url: ${AUTH_SERVICE_URL}
  customer-service-url: ${CUSTOMER_SERVICE_URL}
  branch-service-url: ${BRANCH_SERVICE_URL}
  billpayment-service-url: ${BILLPAYMENT_SERVICE_URL}

banking:
  saga:
    recovery-delay-ms: ${SAGA_RECOVERY_DELAY_MS}
  events:
    transaction-created-topic: ${TRANSACTION_CREATED_TOPIC}
    account-debited-topic: ${ACCOUNT_DEBITED_TOPIC}
    account-credited-topic: ${ACCOUNT_CREDITED_TOPIC}
    bill-payment-success-topic: ${BILL_PAYMENT_SUCCESS_TOPIC}
    bill-payment-failed-topic: ${BILL_PAYMENT_FAILED_TOPIC}

springdoc:
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    com.oracle.banking.workflow: INFO
