server:
  port: 8085

spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${ACCOUNT_DB_USERNAME:BANKING}
    password: ${ACCOUNT_DB_PASSWORD:change-me}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}

services:
  internal-api-key: ${INTERNAL_API_KEY:replace-this-before-production}
  transaction-service-url: ${TRANSACTION_SERVICE_URL:http://localhost:8087}

springdoc:
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    com.oracle.banking.account: INFO
