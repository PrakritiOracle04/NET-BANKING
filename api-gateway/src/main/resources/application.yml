server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS
            allowed-headers: '*'
            allow-credentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: twofa-service
          uri: ${TWOFA_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/2fa/**
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/customers/**
        - id: branch-service
          uri: ${BRANCH_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/branches/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
