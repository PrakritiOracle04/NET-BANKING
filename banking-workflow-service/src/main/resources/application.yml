server:
  port: 8088

spring:
  application:
    name: banking-workflow-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:1000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:1000}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:3000}
        retries: ${KAFKA_PRODUCER_RETRIES:0}

security:
  jwt:
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}

services:
  internal-api-key: ${INTERNAL_API_KEY:replace-this-before-production}
  account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8085}
  beneficiary-service-url: ${BENEFICIARY_SERVICE_URL:http://localhost:8086}
  transaction-service-url: ${TRANSACTION_SERVICE_URL:http://localhost:8087}

banking:
  events:
    transaction-created-topic: ${TRANSACTION_CREATED_TOPIC:transaction-created}
    account-debited-topic: ${ACCOUNT_DEBITED_TOPIC:account-debited}
    account-credited-topic: ${ACCOUNT_CREDITED_TOPIC:account-credited}

springdoc:
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    com.oracle.banking.workflow: INFO
