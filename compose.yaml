x-database-pool: &database-pool
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_MAX_SIZE:-4}
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${DB_POOL_MIN_IDLE:-1}

services:
  kafka:
    image: ghcr.io/kubelauncher/kafka:3.9.0
    container_name: kafka
    environment:
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://host.containers.internal:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/data/kafka
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: reverent_dewdney
    environment:
      KAFKA_CLUSTERS_0_NAME: net-banking
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    volumes:
      - kafka-ui-data:/etc/kafkaui
    restart: unless-stopped

  customer-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: customer-service
    env_file: .env
    environment:
      <<: *database-pool
      CUSTOMER_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      SECURITY_JWT_SECRET: ${JWT_SECRET}

  twofa-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: twofa-service
    env_file: .env
    environment:
      <<: *database-pool
      TWOFA_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      SECURITY_JWT_SECRET: ${JWT_SECRET}

  branch-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: branch-service
    env_file: .env
    environment:
      <<: *database-pool
      BRANCH_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      SECURITY_JWT_SECRET: ${JWT_SECRET}

  transaction-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: transaction-service
    env_file: .env
    environment:
      <<: *database-pool
      TRANSACTION_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}

  account-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: account-service
    env_file: .env
    environment:
      <<: *database-pool
      ACCOUNT_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      TRANSACTION_SERVICE_URL: http://transaction-service:8087
    depends_on:
      - transaction-service

  beneficiary-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: beneficiary-service
    env_file: .env
    environment:
      <<: *database-pool
      BENEFICIARY_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      ACCOUNT_SERVICE_URL: http://account-service:8085
    depends_on:
      - account-service

  billpayment-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: billpayment-service
    env_file: .env
    environment:
      <<: *database-pool
      BILLPAYMENT_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}

  card-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: card-service
    env_file: .env
    environment:
      <<: *database-pool
      CARD_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      ACCOUNT_SERVICE_URL: http://account-service:8085
      AUTH_SERVICE_URL: http://auth-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - account-service
      - auth-service
      - kafka

  banking-workflow-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: banking-workflow-service
    env_file: .env
    environment:
      <<: *database-pool
      WORKFLOW_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      ACCOUNT_SERVICE_URL: http://account-service:8085
      BENEFICIARY_SERVICE_URL: http://beneficiary-service:8086
      TRANSACTION_SERVICE_URL: http://transaction-service:8087
      AUTH_SERVICE_URL: http://auth-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8083
      BRANCH_SERVICE_URL: http://branch-service:8084
      BILLPAYMENT_SERVICE_URL: http://billpayment-service:8090
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - account-service
      - beneficiary-service
      - transaction-service
      - customer-service
      - branch-service
      - billpayment-service
      - kafka

  notification-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: notification-service
    env_file: .env
    environment:
      <<: *database-pool
      NOTIFICATION_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka

  auth-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: auth-service
    env_file: .env
    environment:
      <<: *database-pool
      AUTH_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      CUSTOMER_SERVICE_URL: http://customer-service:8083
      TWOFA_SERVICE_URL: http://twofa-service:8082
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - customer-service
      - twofa-service
      - kafka

  api-gateway:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: api-gateway
    env_file: .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      TWOFA_SERVICE_URL: http://twofa-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8083
      BRANCH_SERVICE_URL: http://branch-service:8084
      ACCOUNT_SERVICE_URL: http://account-service:8085
      BENEFICIARY_SERVICE_URL: http://beneficiary-service:8086
      TRANSACTION_SERVICE_URL: http://transaction-service:8087
      BANKING_WORKFLOW_SERVICE_URL: http://banking-workflow-service:8088
      NOTIFICATION_SERVICE_URL: http://notification-service:8089
      BILLPAYMENT_SERVICE_URL: http://billpayment-service:8090
      CARD_SERVICE_URL: http://card-service:8091
    depends_on:
      - auth-service
      - twofa-service
      - customer-service
      - branch-service
      - account-service
      - beneficiary-service
      - transaction-service
      - banking-workflow-service
      - notification-service
      - billpayment-service
      - card-service
    ports:
      - "8080:8080"

volumes:
  kafka-data:
    name: net-banking-kafka-data
  kafka-ui-data:
    name: net-banking-kafka-ui-data
