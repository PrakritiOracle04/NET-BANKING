services:
  customer-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: customer-service
    env_file: .env
    environment:
      CUSTOMER_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      SECURITY_JWT_SECRET: ${JWT_SECRET}

  twofa-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: twofa-service
    env_file: .env
    environment:
      TWOFA_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      SECURITY_JWT_SECRET: ${JWT_SECRET}

  branch-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: branch-service
    env_file: .env
    environment:
      BRANCH_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      SECURITY_JWT_SECRET: ${JWT_SECRET}

  transaction-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: transaction-service
    env_file: .env
    environment:
      TRANSACTION_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}

  account-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: account-service
    env_file: .env
    environment:
      ACCOUNT_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      TRANSACTION_SERVICE_URL: http://transaction-service:8087
    depends_on:
      - transaction-service

  beneficiary-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: beneficiary-service
    env_file: .env
    environment:
      BENEFICIARY_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}

  banking-workflow-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: banking-workflow-service
    env_file: .env
    environment:
      WORKFLOW_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      ACCOUNT_SERVICE_URL: http://account-service:8085
      BENEFICIARY_SERVICE_URL: http://beneficiary-service:8086
      TRANSACTION_SERVICE_URL: http://transaction-service:8087
    depends_on:
      - account-service
      - beneficiary-service
      - transaction-service

  auth-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: auth-service
    env_file: .env
    environment:
      AUTH_DB_URL: jdbc:oracle:thin:@${ORACLE_HOST:-host.containers.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-FREEPDB1}
      CUSTOMER_SERVICE_URL: http://customer-service:8083
      TWOFA_SERVICE_URL: http://twofa-service:8082
      SECURITY_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - customer-service
      - twofa-service

  api-gateway:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: api-gateway
    env_file: .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      TWOFA_SERVICE_URL: http://twofa-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8083
      BRANCH_SERVICE_URL: http://branch-service:8084
      ACCOUNT_SERVICE_URL: http://account-service:8085
      BENEFICIARY_SERVICE_URL: http://beneficiary-service:8086
      TRANSACTION_SERVICE_URL: http://transaction-service:8087
      BANKING_WORKFLOW_SERVICE_URL: http://banking-workflow-service:8088
    depends_on:
      - auth-service
      - twofa-service
      - customer-service
      - branch-service
      - account-service
      - beneficiary-service
      - transaction-service
      - banking-workflow-service
    ports:
      - "8080:8080"
