server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

banking:
  events:
    registration-success-topic: registration-success
    login-alert-topic: login-alert
    authentication-failed-topic: authentication-failed
    session-logout-topic: session-logout
    session-logout-all-topic: session-logout-all
    password-reset-requested-topic: password-reset-requested
    password-reset-verification-failed-topic: password-reset-verification-failed
    password-reset-verified-topic: password-reset-verified
    password-reset-completed-topic: password-reset-completed

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES}
  sessions:
    cleanup-delay-ms: ${SESSION_CLEANUP_DELAY_MS}

services:
  customer:
    base-url: ${CUSTOMER_SERVICE_URL}
  twofa:
    base-url: ${TWOFA_SERVICE_URL}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL}
  internal-api-key: ${INTERNAL_API_KEY}

password-reset:
  otp-hmac-key: ${PASSWORD_RESET_OTP_HMAC_KEY}
  otp-ttl-seconds: ${PASSWORD_RESET_OTP_TTL_SECONDS}
  token-ttl-seconds: ${PASSWORD_RESET_TOKEN_TTL_SECONDS}
  max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS}
  resend-cooldown-seconds: ${PASSWORD_RESET_RESEND_COOLDOWN_SECONDS}
  retention-days: ${PASSWORD_RESET_RETENTION_DAYS}
  cleanup-delay-ms: ${PASSWORD_RESET_CLEANUP_DELAY_MS}

springdoc:
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    com.oracle.banking.auth: INFO
