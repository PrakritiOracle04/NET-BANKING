x-database-pool: &database-pool
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_MAX_SIZE}
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${DB_POOL_MIN_IDLE}

services:
  kafka:
    image: ghcr.io/kubelauncher/kafka:3.9.0
    container_name: kafka
    environment:
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP}
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/data/kafka
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: reverent_dewdney
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_UI_CLUSTER_NAME}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DYNAMIC_CONFIG_ENABLED: ${KAFKA_UI_DYNAMIC_CONFIG_ENABLED}
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    volumes:
      - kafka-ui-data:/etc/kafkaui
    restart: unless-stopped

  customer-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: customer-service
    env_file: .env
    environment:
      <<: *database-pool
      CUSTOMER_DB_URL: ${CUSTOMER_DB_URL}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - kafka

  twofa-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: twofa-service
    env_file: .env
    environment:
      <<: *database-pool
      TWOFA_DB_URL: ${TWOFA_DB_URL}
      SECURITY_JWT_SECRET: ${JWT_SECRET}

  branch-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: branch-service
    env_file: .env
    environment:
      <<: *database-pool
      BRANCH_DB_URL: ${BRANCH_DB_URL}
      SECURITY_JWT_SECRET: ${JWT_SECRET}

  transaction-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: transaction-service
    env_file: .env
    environment:
      <<: *database-pool
      TRANSACTION_DB_URL: ${TRANSACTION_DB_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - kafka

  account-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: account-service
    env_file: .env
    environment:
      <<: *database-pool
      ACCOUNT_DB_URL: ${ACCOUNT_DB_URL}
      TRANSACTION_SERVICE_URL: ${TRANSACTION_SERVICE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - transaction-service
      - kafka

  beneficiary-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: beneficiary-service
    env_file: .env
    environment:
      <<: *database-pool
      BENEFICIARY_DB_URL: ${BENEFICIARY_DB_URL}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - account-service
      - kafka

  billpayment-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: billpayment-service
    env_file: .env
    environment:
      <<: *database-pool
      BILLPAYMENT_DB_URL: ${BILLPAYMENT_DB_URL}

  card-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: card-service
    env_file: .env
    environment:
      <<: *database-pool
      CARD_DB_URL: ${CARD_DB_URL}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - account-service
      - auth-service
      - kafka

  loan-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: loan-service
    env_file: .env
    environment:
      <<: *database-pool
      LOAN_DB_URL: ${LOAN_DB_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-service
      - kafka

  banking-workflow-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: banking-workflow-service
    env_file: .env
    environment:
      <<: *database-pool
      WORKFLOW_DB_URL: ${WORKFLOW_DB_URL}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL}
      BENEFICIARY_SERVICE_URL: ${BENEFICIARY_SERVICE_URL}
      TRANSACTION_SERVICE_URL: ${TRANSACTION_SERVICE_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      CUSTOMER_SERVICE_URL: ${CUSTOMER_SERVICE_URL}
      BRANCH_SERVICE_URL: ${BRANCH_SERVICE_URL}
      BILLPAYMENT_SERVICE_URL: ${BILLPAYMENT_SERVICE_URL}
      LOAN_SERVICE_URL: ${LOAN_SERVICE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - account-service
      - beneficiary-service
      - transaction-service
      - customer-service
      - branch-service
      - billpayment-service
      - loan-service
      - kafka

  banking-scheduler-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: banking-scheduler-service
    env_file: .env
    environment:
      <<: *database-pool
      SCHEDULER_DB_URL: ${SCHEDULER_DB_URL}
      BANKING_WORKFLOW_SERVICE_URL: ${BANKING_WORKFLOW_SERVICE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - banking-workflow-service
      - kafka

  notification-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: notification-service
    env_file: .env
    environment:
      <<: *database-pool
      NOTIFICATION_DB_URL: ${NOTIFICATION_DB_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - kafka

  auth-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: auth-service
    env_file: .env
    environment:
      <<: *database-pool
      AUTH_DB_URL: ${AUTH_DB_URL}
      CUSTOMER_SERVICE_URL: ${CUSTOMER_SERVICE_URL}
      TWOFA_SERVICE_URL: ${TWOFA_SERVICE_URL}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - customer-service
      - twofa-service
      - kafka

  audit-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: audit-service
    env_file: .env
    environment:
      <<: *database-pool
      AUDIT_DB_URL: ${AUDIT_DB_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - kafka

  report-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: report-service
    env_file: .env
    environment:
      <<: *database-pool
      REPORT_DB_URL: ${REPORT_DB_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REPORT_STORAGE_PATH: ${REPORT_STORAGE_PATH}
    depends_on:
      - auth-service
      - customer-service
      - branch-service
      - account-service
      - beneficiary-service
      - transaction-service
      - banking-workflow-service
      - billpayment-service
      - card-service
      - loan-service
      - banking-scheduler-service
      - audit-service
      - kafka
    volumes:
      - report-data:${REPORT_STORAGE_PATH}

  admin-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: admin-service
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - auth-service
      - customer-service
      - branch-service
      - account-service
      - beneficiary-service
      - transaction-service
      - banking-workflow-service
      - billpayment-service
      - card-service
      - loan-service
      - banking-scheduler-service
      - audit-service
      - kafka

  api-gateway:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: api-gateway
    env_file: .env
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      TWOFA_SERVICE_URL: ${TWOFA_SERVICE_URL}
      CUSTOMER_SERVICE_URL: ${CUSTOMER_SERVICE_URL}
      BRANCH_SERVICE_URL: ${BRANCH_SERVICE_URL}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL}
      BENEFICIARY_SERVICE_URL: ${BENEFICIARY_SERVICE_URL}
      TRANSACTION_SERVICE_URL: ${TRANSACTION_SERVICE_URL}
      BANKING_WORKFLOW_SERVICE_URL: ${BANKING_WORKFLOW_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      BILLPAYMENT_SERVICE_URL: ${BILLPAYMENT_SERVICE_URL}
      CARD_SERVICE_URL: ${CARD_SERVICE_URL}
      LOAN_SERVICE_URL: ${LOAN_SERVICE_URL}
      BANKING_SCHEDULER_SERVICE_URL: ${BANKING_SCHEDULER_SERVICE_URL}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL}
      REPORT_SERVICE_URL: ${REPORT_SERVICE_URL}
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL}
    depends_on:
      - auth-service
      - twofa-service
      - customer-service
      - branch-service
      - account-service
      - beneficiary-service
      - transaction-service
      - banking-workflow-service
      - notification-service
      - billpayment-service
      - card-service
      - loan-service
      - banking-scheduler-service
      - audit-service
      - report-service
      - admin-service
    ports:
      - "8080:8080"

volumes:
  kafka-data:
    name: net-banking-kafka-data
  kafka-ui-data:
    name: net-banking-kafka-ui-data
  report-data:
    name: net-banking-report-data
