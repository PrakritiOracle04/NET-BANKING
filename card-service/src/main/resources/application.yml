server:
  port: 8091

spring:
  application:
    name: card-service
  datasource:
    url: ${CARD_DB_URL}
    username: ${CARD_DB_USERNAME}
    password: ${CARD_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS}
        retries: ${KAFKA_PRODUCER_RETRIES}

security:
  jwt:
    secret: ${JWT_SECRET}

card:
  encryption-key: ${CARD_ENCRYPTION_KEY}
  maximum-daily-limit: ${CARD_MAX_DAILY_LIMIT}
  validity-years: ${CARD_VALIDITY_YEARS}
  events:
    issued-topic: card-issued
    activated-topic: card-activated
    blocked-topic: card-blocked
    unblocked-topic: card-unblocked
    limit-updated-topic: card-limit-updated
    application-submitted-topic: ${CARD_APPLICATION_SUBMITTED_TOPIC}
    application-approved-topic: ${CARD_APPLICATION_APPROVED_TOPIC}
    application-rejected-topic: ${CARD_APPLICATION_REJECTED_TOPIC}
  products:
    classic:
      minimum-annual-income: ${CARD_CLASSIC_MIN_ANNUAL_INCOME}
      default-daily-limit: ${CARD_CLASSIC_DEFAULT_DAILY_LIMIT}
    gold:
      minimum-annual-income: ${CARD_GOLD_MIN_ANNUAL_INCOME}
      default-daily-limit: ${CARD_GOLD_DEFAULT_DAILY_LIMIT}
    platinum:
      minimum-annual-income: ${CARD_PLATINUM_MIN_ANNUAL_INCOME}
      default-daily-limit: ${CARD_PLATINUM_DEFAULT_DAILY_LIMIT}

services:
  internal-api-key: ${INTERNAL_API_KEY}
  account-service-url: ${ACCOUNT_SERVICE_URL}
  auth-service-url: ${AUTH_SERVICE_URL}

springdoc:
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    com.oracle.banking.card: INFO
