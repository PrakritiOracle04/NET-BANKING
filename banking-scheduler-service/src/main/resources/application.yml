server:
  port: 8093

spring:
  application:
    name: banking-scheduler-service
  datasource:
    url: ${SCHEDULER_DB_URL}
    username: ${SCHEDULER_DB_USERNAME}
    password: ${SCHEDULER_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS}
        retries: ${KAFKA_PRODUCER_RETRIES}

security:
  jwt:
    secret: ${JWT_SECRET}

services:
  internal-api-key: ${INTERNAL_API_KEY}
  banking-workflow-service-url: ${BANKING_WORKFLOW_SERVICE_URL}
  auth-service-url: ${AUTH_SERVICE_URL}

banking:
  business-timezone: ${BANKING_BUSINESS_TIMEZONE}
  schedules:
    scan-delay-ms: ${SCHEDULE_SCAN_DELAY_MS}
    default-max-retries: ${SCHEDULE_DEFAULT_MAX_RETRIES}
  system-schedules:
    emi-reminder-time: ${EMI_REMINDER_SCAN_TIME}
    loan-overdue-time: ${LOAN_OVERDUE_SCAN_TIME}
  events:
    schedule-triggered-topic: schedule-triggered
    schedule-completed-topic: schedule-completed
    schedule-failed-topic: schedule-failed
    schedule-created-topic: schedule-created
    schedule-updated-topic: schedule-updated
    schedule-paused-topic: schedule-paused
    schedule-resumed-topic: schedule-resumed
    schedule-cancelled-topic: schedule-cancelled

springdoc:
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    com.oracle.banking.scheduler: INFO
