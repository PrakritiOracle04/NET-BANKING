server:
  port: 8089
spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL}
    username: ${NOTIFICATION_DB_USERNAME}
    password: ${NOTIFICATION_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: ${SMTP_AUTH}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLE}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS}
      mail.smtp.timeout: ${SMTP_TIMEOUT_MS}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap
        spring.json.trusted.packages: '*'
security:
  jwt:
    secret: ${JWT_SECRET}
notification:
  sender-email: ${SMTP_FROM_EMAIL}
  sender-name: ${SMTP_FROM_NAME}
  retry-delay-ms: ${NOTIFICATION_RETRY_DELAY_MS}
  max-retries: ${NOTIFICATION_MAX_RETRIES}
springdoc:
  swagger-ui:
    path: /swagger-ui
logging:
  level:
    com.oracle.banking.notification: INFO
