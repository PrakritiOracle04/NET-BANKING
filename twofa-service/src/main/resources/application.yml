server:
  port: 8082

spring:
  application:
    name: twofa-service
  datasource:
    url: ${TWOFA_DB_URL}
    username: ${TWOFA_DB_USERNAME}
    password: ${TWOFA_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET}

twofa:
  issuer: ${TWOFA_ISSUER}
  encryption-key: ${TWOFA_ENCRYPTION_KEY}

services:
  internal-api-key: ${INTERNAL_API_KEY}

springdoc:
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    com.oracle.banking.twofa: INFO
