server:
  port: 8086

spring:
  application:
    name: beneficiary-service
  datasource:
    url: ${BENEFICIARY_DB_URL}
    username: ${BENEFICIARY_DB_USERNAME}
    password: ${BENEFICIARY_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

security:
  jwt:
    secret: ${JWT_SECRET}

services:
  internal-api-key: ${INTERNAL_API_KEY}
  account-service-url: ${ACCOUNT_SERVICE_URL}

banking:
  events:
    beneficiary-created-topic: beneficiary-created
    beneficiary-updated-topic: beneficiary-updated
    beneficiary-deleted-topic: beneficiary-deleted
    beneficiary-status-changed-topic: beneficiary-status-changed

springdoc:
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    com.oracle.banking.beneficiary: INFO
