server:
  port: 8095

spring:
  application:
    name: report-service
  datasource:
    url: ${REPORT_DB_URL}
    username: ${REPORT_DB_USERNAME}
    password: ${REPORT_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

security:
  jwt:
    secret: ${JWT_SECRET}

services:
  internal-api-key: ${INTERNAL_API_KEY}

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health
