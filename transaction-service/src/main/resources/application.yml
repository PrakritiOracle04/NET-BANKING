server:
  port: 8087

spring:
  application:
    name: transaction-service
  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${TRANSACTION_DB_USERNAME:BANKING}
    password: ${TRANSACTION_DB_PASSWORD:change-me}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}

services:
  internal-api-key: ${INTERNAL_API_KEY:replace-this-before-production}

springdoc:
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    com.oracle.banking.transaction: INFO
