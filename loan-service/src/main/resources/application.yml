server:
  port: 8092

spring:
  application:
    name: loan-service
  datasource:
    url: ${LOAN_DB_URL}
    username: ${LOAN_DB_USERNAME}
    password: ${LOAN_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS}
        retries: ${KAFKA_PRODUCER_RETRIES}

security:
  jwt:
    secret: ${JWT_SECRET}

services:
  internal-api-key: ${INTERNAL_API_KEY}
  auth-service-url: ${AUTH_SERVICE_URL}
  account-service-url: ${ACCOUNT_SERVICE_URL}

loan:
  max-tenure-months: ${LOAN_MAX_TENURE_MONTHS}
  eligibility:
    minimum-monthly-income: ${LOAN_MIN_MONTHLY_INCOME}
    max-amount:
      home: ${LOAN_HOME_MAX_AMOUNT}
      vehicle: ${LOAN_VEHICLE_MAX_AMOUNT}
      personal: ${LOAN_PERSONAL_MAX_AMOUNT}
      education: ${LOAN_EDUCATION_MAX_AMOUNT}
      business: ${LOAN_BUSINESS_MAX_AMOUNT}
  events:
    loan-created-topic: loan-created
    emi-reminder-topic: emi-reminder
    loan-overdue-topic: loan-overdue
    loan-status-changed-topic: loan-status-changed
    application-submitted-topic: ${LOAN_APPLICATION_SUBMITTED_TOPIC}
    application-approved-topic: ${LOAN_APPLICATION_APPROVED_TOPIC}
    application-rejected-topic: ${LOAN_APPLICATION_REJECTED_TOPIC}
  maintenance:
    emi-reminder-days-before: ${EMI_REMINDER_DAYS_BEFORE}

springdoc:
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    com.oracle.banking.loan: INFO
